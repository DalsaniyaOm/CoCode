name: CoCode Automated Testing Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        
    - name: Install Server Dependencies
      working-directory: ./server
      run: npm install

    - name: Run Jest Tests
      working-directory: ./server
      run: npm test
      env:
        JWT_SECRET: cocode_github_actions_dummy_secret_9988
        NODE_ENV: test
